[workspace]
resolver = "2"
members = [
    "crates/pramana-units",
    "crates/pramana-circuit",
    "crates/pramana-hardware",
    "crates/pramana-py",
    "crates/pramana-qec",
    "crates/pramana-risk",
    "crates/pramana-verify",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "Apache-2.0"
repository = "https://github.com/pramana/pramana"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
rand = "0.8"
rand_chacha = "0.3"
rand_distr = "0.4"
toml = "0.5"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
