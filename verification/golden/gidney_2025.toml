# Published figures from Gidney 2025 and the CFS 2024 baseline it improves on.

[[target]]
id = "gidney_2025_rsa2048_logical"
circuit = "shor_factoring_g25"
layer = "logical"

[target.source]
arxiv = "2505.15917"
title = "How to factor 2048 bit RSA integers with less than a million noisy qubits"
year = 2025
locus = "Table 5, n=2048 row"
retrieved = "2026-08-28"

[target.problem]
kind = "rsa_factoring"
modulus_bits = 2048

[target.expected]
logical_qubits = { value = 1399.0, tolerance_pct = 10.0, formula = "m + 3f + 2l + len m" }
toffoli_count = { value = 6.5e9, tolerance_pct = 40.0 }

[target.notes]
text = """
Table 5 gives s=8, l=21, w1=6, w3=3, w4=5, f=33, m=1280 and reports 6.5e9 Toffoli gates
per factoring across an expected 9.2 shots. PRAMANA derives every parameter from Table 2's
formulas and assembles the subroutine tallies of Table 3.
"""

[[target]]
id = "gidney_2025_rsa2048"
circuit = "shor_factoring_g25"
architecture = "gidney_2025_source_calibration"
layer = "physical"

[target.source]
arxiv = "2505.15917"
title = "How to factor 2048 bit RSA integers with less than a million noisy qubits"
year = 2025
locus = "abstract and section 1"
retrieved = "2026-08-28"

[target.problem]
kind = "rsa_factoring"
modulus_bits = 2048

[target.hardware]
physical_error_rate = 0.001
cycle_time_us = 1.0
reaction_time_us = 10.0
connectivity = "square_grid_nearest_neighbour"

[target.expected]
physical_qubits = { value = 1.0e6, comparator = "less_than" }
wall_clock_days = { value = 7.0, comparator = "less_than" }

[target.notes]
text = """
KEYSTONE TARGET. A waiver on this entry fails the build unconditionally (spec 9.3.5).
Costed under the source's own simulated logical error curve (its Figure 6), the same
principle as charging Cuccaro's adder at 2n when reproducing Gidney-Ekera 2019.
Section 3.2 gives the layout: 1280 cold logical qubits at 430 physical each, 131 hot at
1352 each, and a 7x18 compute region, totalling 897,864.
"""

[[target]]
id = "gidney_2025_rsa2048_conservative_curve"
circuit = "shor_factoring_g25"
architecture = "gidney_2025_generic_fit"
layer = "physical"
expected_failure = true

[target.source]
arxiv = "2505.15917"
title = "How to factor 2048 bit RSA integers with less than a million noisy qubits"
year = 2025
locus = "section 3.2, recosted under a generic analytic error curve"
retrieved = "2026-08-28"

[target.problem]
kind = "rsa_factoring"
modulus_bits = 2048

[target.expected]
physical_qubits = { value = 1.0e6, comparator = "less_than" }

[target.notes]
text = """
SENSITIVITY PROBE, EXPECTED TO FAIL. The same layout costed under PRAMANA's generic
analytic error curve rather than the source's simulated one. The generic curve selects
d=27 where the source selects d=25, and those two units of distance move the total across
the million-qubit line. The failure is the finding: it quantifies how much of the headline
claim rests on the noise model rather than on the algorithm.
"""

