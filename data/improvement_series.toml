# The published resource-estimate series.
#
# These are the observations the algorithmic-improvement term is fitted from. They live in
# a data file rather than as constants in the estimation crates for two reasons.
#
# First, Law 1: a published figure embedded in production code is indistinguishable, to a
# reader or a static check, from a lookup table of answers. Here they are declared data with
# provenance, in the same way vendor roadmaps are.
#
# Second, this series is itself a finding. No other resource estimator models the rate at
# which attack costs fall, and the rate differs sharply by problem family. Keeping the
# series versioned and citable makes it possible to publish and to update as new results
# land.
#
# last_verified = 2026-08-29

[[series]]
family = "factoring"
metric = "toffoli"
note = "Gate count rose while width fell: this line of work spent its progress on space."

[[series.point]]
year = 2019
value = 2.6e9
source = "Gidney & Ekera, arXiv:1905.09749"

