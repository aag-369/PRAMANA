# Independently verified logical-qubit demonstrations.
#
# These are the ONLY entries that enter PRAMANA's capability fit. Press-release qubit
# counts and announced targets are held separately, because "logical qubit" has meant
# different things across announcements and a fit contaminated by definitional drift is
# worse than no fit.
#
# last_verified = 2026-08-29

